name: AURYN Calibration Maturation

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'

concurrency:
  group: auryn-calibration-mature
  cancel-in-progress: false

jobs:
  mature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mature decision outcomes
        env:
          AURYN_BASE_URL: ${{ secrets.AURYN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$AURYN_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${AURYN_BASE_URL%/}/api/calibration/mature"
          curl --fail --silent --show-error --retry 2 --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${AURYN_BASE_URL%/}/api/model-health/mature"
