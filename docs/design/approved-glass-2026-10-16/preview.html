fect="non-scaling-stroke"/>`).join('')}<polygon points="0,190 ${line} 600,190" fill="url(#au-fill)"/>${chartMode==='Levels'&&kind!=='portfolio'?`<rect x="0" y="104" width="600" height="22" fill="#157663" opacity=".08"/><line x1="0" x2="600" y1="114" y2="114" stroke="#157663" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/><line x1="0" x2="600" y1="42" y2="42" stroke="#916214" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>`:''}<polyline points="${line}" fill="none" stroke="#315fd6" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></div><div class="au-chartaxis"><span>$${Math.ceil(max)}</span><span>$${Math.round((min+max)/2)}</span><span>$${Math.floor(min)}</span></div></div><div class="au-chartmonths"><span>${range==='1D'?'09:30':range==='1W'?'Mon':range==='1M'?'Sep 16':range==='1Y'?'Oct 2025':'2021'}</span><span>${range==='1D'?'12:00':range==='1W'?'Wed':range==='1M'?'Oct 1':range==='1Y'?'Apr':'2023'}</span><span>${range==='1D'?'16:00':range==='1W'?'Fri':range==='1M'?'Oct 16':range==='1Y'?'Oct 2026':'2026'}</span></div><div class="au-row" style="margin-top:15px"><div class="au-ranges" aria-label="Chart range">${['1D','1W','1M','1Y','5Y'].map(x=>`<button data-range="${x}" aria-pressed="${range===x}">${x}</button>`).join('')}</div><span class="au-small au-muted">Scroll freely</span></div>`};

nancials">All financials →</button></div><div class="au-facts"><div><span class="au-small au-muted">Revenue growth ${help('Revenue growth','Year-over-year revenue growth compares sales with the same period a year earlier. Growth alone does not establish profitability or value.')}</span><div class="au-metric">+18.6%</div><span class="au-small au-positive">Broad-based demand</span>${spark(0)}</div><div><span class="au-small au-muted">Free cash flow ${help('Free cash flow','Operating cash flow minus capital spending. The figure must identify its reporting period and currency. Stock-based compensation and dilution also matter.')}</span><div class="au-metric">$2.4B</div><span class="au-small au-muted">Trailing 12 months</span>${spark(1)}</div><div><span class="au-small au-muted">Net retention ${help('Net revenue retention','Revenue retained from existing customers, including expansion and churn. Definitions vary by company; the original company definition must accompany the real metric.')}</span><div class="au-metric">116%</div><span class="au-small au-muted">Existing customers expand</span>${spark(2)}</div></div></section><div class="au-two au-support">${panel('Why the business can endure',`<p class="au-small au-muted">Embedded workflows make switching costly. Recurring contracts support cash generation.</p><button class="au-link" data-tab="Business" style="margin-top:12px">See the moat evidence →</button>`)}${panel('The risk that matters',`<p class="au-small au-muted">Infrastructure spending is growing faster than revenue. Watch cash conversion over the next two quarters.</p><button class="au-link" data-tab="Risks" style="margin-top:12px">Track the thesis risks →</button>`)}</div>`;

const methodology=()=>`${head('How a decision earns its place.','One consistent decision, backed by visible evidence.')}<div class="au-stack">${[['1 · Establish the business','Use company filings, financial statements, operating metrics and dated thesis evidence. Separate missing data from weak performance.'],['2 · Test the price','Use a model suited to the company’s stage and sector. Show bear, base and bull assumptions instead of one precise-looking target.'],['3 · Assess the entry','Use price structure, trend, momentum and participation. Technical timing cannot stand in for a moat or long-term thesis.'],['4 · Respect the portfolio','Apply cash, concentration and position limits. An attractive idea can still be too large for your account.'],['5 · Measure the outcome','Evaluate decisions with point-in-time data and a consistent benchmark. Publish limitations and keep paper experiments separate from production rules.']].map(x=>panel(x[0],`<p class="au-small au-muted">${x[1]}</p>`)).join('')}</div>`;
const legal=(name)=>{const copy={privacy:[['Your portfolio stays yours','Holdings, notes, preferences and alerts belong to your account. Access should be restricted to the signed-in user.'],['What the service needs','Authentication, saved research and selected account connections are used to provide the features you enable. API credentials must remain on the server.'],['Your controls','You can disconnect optional services and request export or deletion. Retention periods and service providers must be confirmed before publication.']],terms:[['Using AURYN','AURYN provides investment research and planning tools. You are responsible for decisions made using the service.'],['Data and availability','Prices, company disclosures and derived metrics can be delayed, incomplete or incorrect. Sources and timestamps should be visible.'],['Account responsibilities','Protect access to your account and connected services. Paper-trading experiments do not guarantee real-world execution or returns.']],disclaimer:[['Research, not a promise','Signals and scenarios are uncertain estimates. They do not guarantee returns or establish suitability for any particular investor.'],['Understand the downside','Investments can lose value. Concentration, volatility, liquidity, dilution and execution costs all matter.'],['Paper results have limits','Simulation can differ from real fills, fees and market conditions. Historical outcomes do not predict future performance.']]};return `${head(name==='privacy'?'Your data & privacy':name==='terms'?'Using AURYN responsibly':'Investment disclosure','Proposed product copy · legal wording requires review before publication.')}<div class="au-stack">${copy[name].map(x=>panel(x[0],`<p class="au-small au-muted">${x[1]}</p>`)).join('')}</div>`};
const auth=(kind)=>{const names={login:'Welcome back.',register:'Build your investing workspace.',forgot:'Reset your password.',reset:'Choose a new password.'};return `<div class="au-auth"><div class="au-brand" style="padding:0;margin-bottom:26px"><img class="au-brandimage" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzNiAzOCIgd2lkdGg9IjMwIiBoZWlnaHQ9IjMyIiBhcmlhLWhpZGRlbj0idHJ1ZSI+PHBhdGggZmlsbD0iIzI4NjZlZiIgZD0iTTE0IDNoOUwxMCAzNEgxeiIvPjxwYXRoIGZpbGw9IiM3NmEwZmYiIGQ9Im0yMyAzIDEyIDMxSDIzTDEyIDd6Ii8+PHBhdGggZmlsbD0iIzE0NTBkNyIgZD0ibTE4IDIxIDUgMTNIMTB6Ii8+PHBhdGggZmlsbD0iI2FkYzZmZiIgZD0ibTE0IDMgNCAxMCA1LTEweiIvPjwvc3ZnPg==" alt="">AURYN</div><h1>${names[kind]}</h1><p class="au-summary">${kind==='forgot'?'We’ll send a reset link if an account matches your email.':kind==='reset'?'Use a unique password for your account.':'Clarity for every investment decision.'}</p>${kind==='register'?'<label class="au-field">Name<input class="au-input" autocomplete="name" placeholder="Your name"></label>':''}${kind!=='reset'?'<label class="au-field">Email<input class="au-input" type="email" autocomplete="email" placeholder="you@example.com"></label>':''}${kind!=='forgot'?`<label class="au-field">Password<input class="au-input" type="password" autocomplete="${kind==='login'?'current-password':'new-password'}" placeholder="${kind==='login'?'Your password':'Create a strong password'}"></label>`:''}${btn(kind==='login'?'Sign in':kind==='register'?'Create account':kind==='forgot'?'Send reset link':'Save password',`data-do="auth" data-kind="${kind}"`,true)}<div class="au-chiprow">${kind==='login'?btn('Forgot password?','data-route="forgot"')+btn('Create account','data-route="register"'):btn('Back to sign in','data-route="login"')}</div><p class="au-policy">Design preview only. Do not enter a real password.</p></div>`};
const onboarding=()=>`${head('Start with how you invest.','Three preferences. You can change them any time.')}<div class="au-two">${panel('Your approach',`<label class="au-field">Investing horizon<select class="au-input"><option>3–5 years</option><option>1–3 years</option><option>Under 1 year</option></select></label><label class="au-field">Experience<select class="au-input"><option>Keep it simple</option><option>I know the basics</option><option>Show full evidence</option></select></label><label class="au-field">Monthly contribution (optional)<input class="au-input" type="number" min="0" value="100"></label>${btn('Open my workspace','data-route="today"',true)}`)}${panel('What you’ll see first',`<div class="au-timeline"><div><h3>A clear starting point</h3><p class="au-summary">An action, its reason and the evidence still needed.</p></div><div><h3>A manageable contribution</h3><p class="au-summary">An amount you understand, within your own limits.</p></div><div><h3>Depth when you need it</h3><p class="au-summary">Financials, valuation, technicals and source evidence.</p></div></div>`)}</div>`;
function statusView(){if(state==='error')return `${head('Your workspace is still here.','We couldn’t refresh the data connection.')}<section class="au-panel au-empty">${icon('cloud-off')}<h2>Refresh temporarily unavailable</h2><p>Saved notes and settings remain accessible. New recommendations and contribution increases wait for fresh evidence.</p>${btn('Try again','data-do="retry"',true)} ${btn('Open saved research','data-route="saved"')}</section>`;if(state==='empty')return `${head(route==='portfolio'?'Build a clearer portfolio.':route==='alerts'?'Stay informed, without the noise.':'Start with one investment.','Your workspace grows from what you choose to follow.')}<section class="au-panel au-empty">${icon(route==='portfolio'?'pie-chart':route==='alerts'?'bell':'bookmark')}<h2>${route==='portfolio'?'No holdings yet':route==='alerts'?'No alerts yet':'Your shortlist is empty'}</h2><p>${route==='portfolio'?'Add a holding to see allocation and concentration.':route==='alerts'?'Create a price or earnings alert for a company you follow.':'Search a company to see its business, valuation and entry conditions.'}</p>${btn(route==='portfolio'?'Add first holding':route==='alerts'?'Create first alert':'Find an investment',`data-do="${route==='portfolio'?'holding':route==='alerts'?'alert':'search'}"`,true)}</section>`;return null}
function render(){let content=statusView();if(!content){if(route==='research')content=research();else if(state==='missing')content=missing();else content=({today,discover:discoverPage,saved:savedPage,portfolio,alerts,paper,'research-lab':lab,settings,help:helpPage,onboarding,methodology,about:()=>`${head('Clarity before action.','AURYN brings the business, the price and your portfolio into one decision.')}<div class="au-two">${panel('Built for thoughtful investors',`<p class="au-small au-muted">Start with a clear answer. See why it exists. Explore deeper evidence without losing the thread.</p>`)}${panel('Designed to stay honest',`<p class="au-small au-muted">Missing data stays missing. Signals carry dates. Long-term conviction stays separate from short-term timing.</p>`)}</div>`,privacy:()=>legal('privacy'),terms:()=>legal('terms'),disclaimer:()=>legal('disclaimer'),login:()=>auth('login'),register:()=>auth('register'),forgot:()=>auth('forgot'),reset:()=>auth('reset')}[route]||today)()}
$('#au-view').innerHTML=(state==='loading'?'<div class="au-status" role="status">Updating data · keeping the last available view in place</div>':'')+content+`<footer class="au-footer"><span>Illustrative content · no investment recommendation</span><span><button class="au-link" data-route="methodology">Methodology</button> · <button class="au-link" data-route="help">Help</button></span></footer>`;$('#au-nav').innerHTML=routes.map(r=>`<button class="au-nav" data-route="${r[0]}" data-active="${route===r[0]}">${icon(r[2])}${r[1]}</button>`).join('');$('#au-dock').innerHTML=[routes[0],routes[2],routes[3],routes[4]].map(r=>`<button data-route="${r[0]}" data-active="${route===r[0]}">${icon(r[2])}${r[1]}</button>`).join('');$('#au-screen').value=route==='research'?'research:'+tab:route;$('#au-state').value=state;paintIcons();}
function paintIcons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.7}})}
function go(r,t){route=r;state='ready';if(t)tab=t;$('#au-toast').classList.remove('show');render()}
function toast(t){$('#au-toast').textContent=t;$('#au-toast').classList.add('show')}
function modal(title,body){$('#au-modalcontent').innerHTML=`<div class="au-panelhead"><h2 id="au-dialogtitle">${title}</h2><button class="au-icon" data-do="close" aria-label="Close dialog">${icon('x')}</button></div>${body}`;$('#au-modal').showModal();paintIcons()}
function close(){if($('#au-modal').open)$('#au-modal').close()}
function searchResults(q=''){$('#au-searchresults').innerHTML=companies.filter(c=>(c.n+' '+c.s).toLowerCase().includes(q.toLowerCase())).map(c=>stockrow(c,companies.indexOf(c))).join('')||'<p>No sample company matches. Try NSTR, HELIO or ORBT.</p>';paintIcons()}
$('#au-screen').innerHTML=`<optgroup label="Main app">${routes.filter(r=>r[0]!=='research').map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</optgroup><optgroup label="Stock research">${researchTabs.map(t=>`<option value="research:${t}">Stock · ${t}</option>`).join('')}</optgroup><optgroup label="Account & supporting pages">${otherRoutes.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</optgroup>`;
root.addEventListener('change',e=>{const t=e.target;if(t.id==='au-alerttype'){$('#au-alertprice').style.display=t.selectedIndex===2?'none':'grid'}if(t.id==='au-screen'){const [r,s]=t.value.split(':');go(r,s)}if(t.id==='au-state'){state=t.value;render()}if(t.id==='au-more'&&t.value){tab=t.value;render()}});
root.addEventListener('input',e=>{if(e.target.id==='au-searchinput')searchResults(e.target.value);if(e.target.id==='au-amount'){$('#au-amountresult').textContent='$'+(Number(e.target.value)||0).toFixed(0)}});
root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='au-size'){const on=$('#au-app').classList.toggle('au-phone');t.textContent=on?'Desktop view':'iPhone view';t.setAttribute('aria-pressed',on);return}if(t.dataset.route){close();go(t.dataset.route,t.dataset.openTab);return}if(t.dataset.tab){tab=t.dataset.tab;route='research';state='ready';close();render();return}if(t.dataset.stock!==undefined){company=Number(t.dataset.stock);close();go('research','Overview');return}if(t.dataset.range){range=t.dataset.range;render();return}if(t.dataset.tech){tech=t.dataset.tech;render();return}if(t.dataset.discover){discover=t.dataset.discover;render();return}if(t.dataset.help){modal(t.dataset.help,`<p>${t.dataset.copy}</p>${btn('Got it','data-do="close"',true)}`);return}const action=t.dataset.do;if(!action)return;
if(action==='close')close();
if(action==='moremenu'){const p=$('#au-morepanel');p.hidden=!p.hidden;t.setAttribute('aria-expanded',!p.hidden);if(!p.hidden)p.querySelector('button').focus()}
if(action==='chartmode'){chartMode=chartMode==='Price'?'Levels':'Price';render()}
if(action==='search'){modal('Find an investment',`<label class="au-field">Company or symbol<input class="au-input" id="au-searchinput" placeholder="Search sample companies" autocomplete="off"></label><div class="au-list" id="au-searchresults"></div><p class="au-policy">Fictional companies for design review.</p>`);searchResults();$('#au-searchinput').focus()}
if(action==='menu')modal('Your workspace',`<div class="au-list">${routes.map(r=>`<button class="au-listrow" data-route="${r[0]}">${r[1]}<span>→</span></button>`).join('')}</div>`);
if(action==='save'){saved=!saved;render();toast(saved?'Saved in this preview.':'Removed from the preview shortlist.')}
if(action==='contribution')modal('Keep it simple.',`<p>Your regular contribution. No manual multipliers to tune.</p><label class="au-field">Monthly amount (USD)<input class="au-input" type="number" id="au-amount" value="${budget}" min="0" max="10000"></label><div class="au-note"><span><strong id="au-amountresult">$${budget}</strong> × 1 = your regular amount<br>Position limit: 10% · cash and exposure checked before execution.</span></div><p>Changing this plan does not place an order.</p>${btn('Save amount','data-do="saveamount"',true)}`);
if(action==='saveamount'){const n=Number($('#au-amount').value);if(!Number.isFinite(n)||n<0||n>10000){$('#au-amount').setCustomValidity('Enter an amount from 0 to 10,000.');$('#au-amount').reportValidity();return}budget=n;close();render();toast('Contribution updated in the preview. No order placed.')}
if(action==='alert')modal('Create an alert',`<label class="au-field">Investment<select class="au-input">${companies.map(c=>`<option>${c.s} · ${c.n}</option>`).join('')}</select></label><label class="au-field">Notify me when<select class="au-input" id="au-alerttype"><option>Price falls to or below</option><option>Price rises to or above</option><option>Earnings are one day away</option></select></label><label class="au-field" id="au-alertprice">Price in USD<input class="au-input" type="number" min="0" value="121"></label><label class="au-check"><input type="checkbox" checked>Once per day, to avoid repeats</label>${btn('Save preview alert','data-do="savealert"',true)}`);
if(action==='savealert'){close();toast('Preview alert saved. No real notifications are scheduled.')}
if(action==='togglealert'){const pause=t.textContent==='Pause';t.textContent=pause?'Resume':'Pause';toast(pause?'Alert paused in the preview.':'Alert resumed in the preview.')}
if(action==='holding')modal('Add a holding',`<label class="au-field">Symbol<select class="au-input">${companies.map(c=>`<option>${c.s}</option>`).join('')}</select></label><label class="au-field">Number of shares<input class="au-input" type="number" min="0" value="10"></label><label class="au-field">Average cost per share (USD)<input class="au-input" type="number" min="0" value="110"></label>${btn('Save preview holding','data-do="saveholding"',true)}`);
if(action==='saveholding'){close();go('portfolio');toast('Holding form completed in the preview. No account was changed.')}
if(action==='note')modal('Your thesis note',`<label class="au-field">Northstar Cloud<textarea class="au-input" rows="4">Watch cash conversion. Do not increase just because the stock falls.</textarea></label>${btn('Save note','data-do="savenote"',true)}`);
if(action==='savenote'){close();toast('Preview note reviewed. Production persistence is outside this mockup.')}
if(action==='compare')modal('Compare the evidence',table(['Lens','NSTR','HELIO'],[['Business','Resilient','Cyclical'],['Valuation','Fair','Attractive'],['Funding risk','Low','Elevated'],['Entry','Wait','Start small']])+'<p>Illustrative comparison. Each company keeps its own business and risk context.</p>');
if(action==='papercheck')modal('Paper-run checklist',list([['Account access','Not connected'],['Admin authorization','Not verified'],['Current evidence','No live data'],['Exposure checks','Not evaluated'],['Order submission','Blocked']])+'<p>The design preview cannot resume automation or submit orders.</p>');
if(action==='preferences'){const n=Number($('#au-settingsbudget').value);if(Number.isFinite(n)&&n>=0)budget=n;toast('Preferences updated for this preview only.')}
if(action==='profile')modal('Your profile','<label class="au-field">Display name<input class="au-input" placeholder="Your name"></label>'+btn('Save preview profile','data-do="savenote"',true));
if(action==='export')modal('Export your data','<p>Production export includes holdings, saved companies, thesis notes and preferences. This preview contains no personal account data.</p>'+btn('Close','data-do="close"',true));
if(action==='auth'){if(t.dataset.kind==='forgot')toast('Preview: if that address has an account, a reset email would be sent.');else go(t.dataset.kind==='register'?'onboarding':'today')}
if(action==='reminder')toast('Reminder selected in the preview. No calendar event created.');
if(action==='retry'){state='ready';render();toast('Showing the populated design state. This does not test a live connection.')}
if(action==='availablechart'){state='ready';tab='Technicals';route='research';render()}
});
root.addEventListener('click',e=>{const m=$('#au-morepanel');if(m&&!e.target.closest('.au-morewrap')){m.hidden=true;root.querySelector('[data-do=moremenu]').setAttribute('aria-expanded','false')}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#au-morepanel');if(m&&!m.hidden){m.hidden=true;const b=root.querySelector('[data-do=moremenu]');b.setAttribute('aria-expanded','false');b.focus()}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();root.querySelector('[data-do="search"]').click()}});render();
})();
</script>
</div>
</html>
