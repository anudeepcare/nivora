    function metricCards(limit=3){return `<div class="au-three">${metricData().slice(0,limit).map(m=>`<section class="au-panel au-trendmetric"><div class="au-metric-title">${m.label}${help(m.key,m.label)}</div><div class="au-metric-value au-num">${m.unit}${m.value}</div><div class="au-delta ${m.series.at(-1)<0?'au-amber':'au-positive'}">${m.change}</div>${chart('bars',105,`data-metric="${m.key}"`)}${source(state.period+' · Sample periods')}</section>`).join('')}</div>`}
    function thesis(){const a=securities[state.symbol];if(a.kind==='Crypto')return `<div class="au-two au-plainsection"><div class="au-case"><h3 class="au-case-head au-positive">${icon('arrow-up-right')}The positive case</h3><ul><li>${icon('check')}<div>Growing network use<small>Review activity, adoption and liquidity with dedicated network data.</small></div></li><li>${icon('check')}<div>Improving market structure<small>Confirm with settled price and volume history.</small></div></li></ul></div><div class="au-case"><h3 class="au-case-head au-amber">${icon('shield-alert')}What could go wrong</h3><ul><li>${icon('minus')}<div>Deep drawdowns<small>Technical zones do not limit losses.</small></div></li><li>${icon('minus')}<div>Network and custody risk<small>Company revenue, P/E and company DCF do not apply.</small></div></li></ul></div></div>`;return `<div class="au-two au-plainsection"><div class="au-case"><h3 class="au-case-head au-positive">${icon('arrow-up-right')}The bull case</h3><ul><li>${icon('check')}<div>Growth is becoming cash<small>In this example, revenue rises 26% and cash flow grows faster.</small></div></li><li>${icon('check')}<div>More from each dollar of sales<small>Margin expansion supports the earnings scenario.</small></div></li></ul></div><div class="au-case"><h3 class="au-case-head au-amber">${icon('shield-alert')}The bear case</h3><ul><li>${icon('minus')}<div>Expectations are already high<small>Slower growth would reduce the modeled value range.</small></div></li><li>${icon('minus')}<div>Durability still needs evidence<small>Check competition, customer retention and platform dependence.</small></div></li></ul></div></div>`}
    function dca(){const a=securities[state.symbol];return `<section class="au-panel au-dca"><div class="au-between au-dca-top"><span class="au-eyebrow">Accumulation</span>${help('dca','accumulation pace')}</div><div class="au-dca-number au-num">${a.pace.replace('×','')}<span>×</span></div><div class="au-dca-scale">${['Pause','1×','2×','4×'].map(x=>`<span class="${x===a.pace?'active':''}">${x}</span>`).join('')}</div><p class="au-caption">${a.pace==='4×'?'Deep-zone example. Higher risk remains.':a.pace==='2×'?'Twice the baseline pace in this sample.':'Regular baseline pace in this sample.'} No amount needed.</p><button type="button" class="au-link" data-help="dca">Why this pace? ${icon('arrow-up-right')}</button></section>`}
    function pricePanel(technical=false){return `<section class="au-panel"><div class="au-panel-head"><h3>${technical?'Price & key levels':'Price history'}</h3>${ranges()}</div>${technical?`<div class="au-flex" style="margin-bottom:14px;flex-wrap:wrap"><label class="au-check"><input type="checkbox" data-toggle="fib" ${state.fib?'checked':''}>Fibonacci</label><label class="au-check"><input type="checkbox" data-toggle="ma" ${state.ma?'checked':''}>Trend average</label></div>`:''}${chart(technical?'technical':'price',technical?260:218)}<div class="au-chart-foot"><span>${state.symbol} · USD · ${state.range}</span><span>Sample history · Tap to inspect</span></div></section>`}
    function research(){const a=securities[state.symbol];return `<div class="au-securityhead"><div class="au-flex">${logo(state.symbol,true)}<div><h1>${a.name}</h1><div class="au-caption" style="margin-top:4px">${a.exchange} ${a.kind==='Stock'?'· '+state.symbol:''}</div></div><button type="button" class="au-icon" data-action="save" aria-label="${state.saved.has(state.symbol)?'Remove from':'Add to'} watchlist">${icon(state.saved.has(state.symbol)?'bookmark-check':'bookmark-plus')}</button></div><div class="au-quote"><div class="au-price au-num">${money(a.price)}</div><small><span class="${a.change>=0?'au-positive':'au-negative'}">${signed(a.change)}</span> <span>· Sample quote</span></small></div></div><div class="au-localtabs" aria-label="Research sections">${['Snapshot','Financials','Valuation','Technicals','Thesis'].map(x=>`<button type="button" data-tab="${x}" aria-pressed="${state.tab===x}">${x}</button>`).join('')}</div><div id="au-research-content" class="au-stack">${researchContent()}</div>`}
    function researchContent(){const a=securities[state.symbol];if(state.tab==='Financials')return financials();if(state.tab==='Valuation')return valuation();if(state.tab==='Technicals')return technicals();if(state.tab==='Thesis')return thesisPage();return `<div class="au-takeaway" style="margin-bottom:0"><span class="au-eyebrow">At a glance · Illustrative assessment</span><h2>${a.kind==='Crypto'?'A network asset. A different way to research.':state.symbol==='IREN'?'High growth potential. A demanding investment cycle.':'Growth is improving. Keep valuation in view.'}</h2><p>${a.kind==='Crypto'?'Focus on the network, market structure and risk. Stock earnings and company valuation metrics are excluded.':state.symbol==='IREN'?'Separate the long-term business thesis from short-term price weakness. Cash needs and dilution deserve equal attention.':'Revenue, cash generation and price expectations belong in one view. Here is what supports the case—and what could change it.'}</p><div class="au-verdicts"><div><small>${a.kind==='Crypto'?'ASSET TYPE':'BUSINESS'}</small><b>${a.quality}</b></div><div><small>VALUATION</small><b>${a.valuation}</b></div><div><small>ENTRY CONTEXT</small><b class="au-positive">${a.timing}</b></div></div></div><div class="au-mainrail">${pricePanel()}${dca()}</div>${a.kind==='Stock'?`<section><div class="au-section-head"><h2>The business, in numbers</h2><button type="button" class="au-link" data-tab="Financials">All financials ${icon('arrow-up-right')}</button></div>${metricCards()}</section>`:`<div class="au-notice">${icon('info')}Network activity and token supply would appear here only when a suitable data source is connected.</div>`}<section><div class="au-section-head"><h2>Both sides of the story</h2><button type="button" class="au-link" data-tab="Thesis">Full thesis ${icon('arrow-up-right')}</button></div>${thesis()}</section>`}
    function financials(){if(securities[state.symbol].kind==='Crypto')return cryptoExclusion('Financial statements');let list=metricData();if(state.category==='Cash flow')list=list.filter(x=>['fcf','margin','cash'].includes(x.key));if(state.category==='Balance sheet')list=list.filter(x=>['cash','debt','shares'].includes(x.key));return `<div class="au-between"><div><h2>Follow the fundamentals.</h2><p class="au-caption" style="margin-top:6px">${state.symbol==='SAP'?'EUR reporting · USD share price · Kept separate':'One reporting period. Consistent units. Clear sources.'}</p></div>${periods()}</div><div class="au-filters">${['Overview','Cash flow','Balance sheet','Statements'].map(x=>`<button type="button" data-category="${x}" aria-pressed="${state.category===x}">${x}</button>`).join('')}</div>${state.category==='Statements'?`<section class="au-panel"><div class="au-panel-head"><h3>Income & cash flow</h3><span class="au-caption">Sample USD billions</span></div><table class="au-table"><thead><tr><th>Metric</th><th>2023</th><th>2024</th><th>2025</th></tr></thead><tbody>${metricData().slice(0,4).map((m,i)=>`<tr><td>${m.label}</td><td>${[2.7,.6,22.2,1.3][i]}</td><td>${[3.4,.9,26.5,1.7][i]}</td><td>${[4.3,1.3,30.2,2.1][i]}${i===2?'%':''}</td></tr>`).join('')}</tbody></table>${source('Illustrative statement · Not a company filing')}</section>`:`<div class="au-two">${list.map(m=>`<section class="au-panel"><div class="au-metric-title">${m.label}${help(m.key,m.label)}</div><div class="au-between"><span class="au-metric-value au-num">${m.unit}${m.value}</span><span class="au-delta ${m.series.at(-1)<0?'au-amber':'au-positive'}">${m.change}</span></div>${chart('bars',160,`data-metric="${m.key}"`)}${source(state.period+' · Sample history')}</section>`).join('')}</div>`}`}
    function cryptoExclusion(label){return `<section class="au-panel au-empty">${icon('coins')}<h2>${label} do not apply.</h2><p class="au-muted" style="max-width:430px">${securities[state.symbol].name} is a cryptoasset. Research market structure, supply, adoption and network risks instead.</p><button type="button" class="au-button" data-tab="Technicals">View market structure ${icon('arrow-right')}</button></section>`}
    function valuation(){if(securities[state.symbol].kind==='Crypto')return cryptoExclusion('Company valuation models');if(state.symbol==='SAP')return `<section class="au-panel au-stack"><h2>Match the share to the business.</h2><p class="au-muted">This ADR trades in USD while the company reports in EUR. A credible price estimate needs the ADR ratio, matched share count and dated exchange rate.</p><div class="au-notice">${icon('info')}This design state keeps the valuation open rather than filling it with an unverified conversion.</div><button type="button" class="au-button" data-tab="Financials">View reported financials ${icon('arrow-right')}</button></section>`;const base=5*Math.pow(1+state.valuationGrowth/100,5)*state.valuationMultiple/Math.pow(1.1,5);return `<div class="au-between"><div><h2>Understand the price you pay.</h2><p class="au-caption" style="margin-top:6px">An editable example—not an analyst target.</p></div>${help('valuation','valuation assumptions')}</div><div class="au-two"><section class="au-panel"><span class="au-eyebrow">Five-year earnings scenario</span><div class="au-metric-value au-num" style="font-size:38px;margin-top:12px" id="au-base-value">${money(base,0)}</div><p class="au-caption">Illustrative value today per share</p><div class="au-val-range"><span></span><span></span><span></span></div><div class="au-scenario-values"><div><small>Bear</small><b class="au-num" id="au-bear-value">${money(base*.72,0)}</b></div><div><small>Base</small><b class="au-num" id="au-center-value">${money(base,0)}</b></div><div><small>Bull</small><b class="au-num" id="au-bull-value">${money(base*1.24,0)}</b></div></div><div class="au-rule"></div><div class="au-between"><span class="au-caption">Sample market price</span><b class="au-num">${money(securities[state.symbol].price)}</b></div></section><section class="au-panel"><h3>Make the assumptions yours.</h3><label class="au-sliderfield"><span class="au-between"><span>Annual EPS growth</span><b id="au-growth-label">${state.valuationGrowth}%</b></span><input type="range" min="0" max="35" value="${state.valuationGrowth}" data-slider="growth" aria-label="Annual earnings per share growth"></label><label class="au-sliderfield"><span class="au-between"><span>Exit P/E multiple</span><b id="au-multiple-label">${state.valuationMultiple}×</b></span><input type="range" min="10" max="40" value="${state.valuationMultiple}" data-slider="multiple" aria-label="Exit price to earnings multiple"></label><div class="au-rule"></div><div class="au-between au-caption"><span>Starting EPS · Sample</span><span>$5.00</span></div><div class="au-between au-caption" style="margin-top:10px"><span>Discount rate / horizon</span><span>10% / 5 years</span></div></section></div><div class="au-notice">${icon('info')}A small change in growth or the exit multiple can change value materially. The shaded range represents assumptions, not statistical confidence.</div><section class="au-plainsection"><h3>What needs to stay true</h3><div class="au-event">${icon('trending-up')}<div><p>Growth continues without excessive dilution.</p><small>Watch revenue, margins and diluted share count together.</small></div></div><div class="au-event">${icon('banknote')}<div><p>Earnings translate into cash.</p><small>Cash conversion and reinvestment needs support—or weaken—the scenario.</small></div></div></section>`}
    function fibValue(r){let values=sequence(state.range==='1D'?32:state.range==='1W'?30:state.range==='1M'?28:60,securities[state.symbol].price);const base=securities[state.symbol].price;if(state.range==='1D')values=values.map(v=>base+((v/base)-1)*base*.06);if(state.range==='1W')values=values.map(v=>base+(v-base)*.2);if(state.range==='1M')values=values.map(v=>base+(v-base)*.4);return Math.max(...values)-(Math.max(...values)-Math.min(...values))*r}function studyGroup(title,ico,rows){return `<section class="au-studygroup"><h3 class="au-studyhead">${icon(ico)}${title}</h3>${rows.map(([label,value,meaning,key])=>`<div class="au-studyrow"><span class="au-studyname">${label}${help(key,label)}</span><b class="au-studyvalue">${value}</b><span class="au-caption">${meaning}</span></div>`).join('')}</section>`}
    function technicals(){
      const p=securities[state.symbol].price,weekly=state.techFrame==='Weekly',multiple=weekly?.94:1;
      return `<div class="au-between"><div><h2>The setup, at a glance.</h2><p class="au-caption" style="margin-top:6px">Price structure · Momentum · Participation · Risk</p></div><div class="au-segment" aria-label="Indicator timeframe">${['Daily','Weekly'].map(x=>`<button type="button" data-techframe="${x}" aria-pressed="${state.techFrame===x}">${x}</button>`).join('')}</div></div>
      <div class="au-technical-summary"><span class="au-chip blue">Trend recovering</span><span class="au-chip">RSI ${weekly?'54.2':'48.6'} · Balanced</span><button type="button" class="au-chip good" data-help="dca" style="min-height:34px">${securities[state.symbol].pace} sample pace ${icon('circle-help')}</button></div>
      ${pricePanel(true)}
      <div class="au-between"><h2>The evidence behind the setup</h2><span class="au-caption">${state.techFrame} · Illustrative studies</span></div>
      <div class="au-two">
      ${studyGroup('Trend','trending-up',[
        ['EMA 20',money(p*.97*multiple),'Price is above the short-term average in this example.','averages'],
        ['SMA 50',money(p*.94*multiple),'Intermediate trend reference.','averages'],
        ['SMA 200',money(p*.84*multiple),'Longer-term price context.','averages'],
        ['ADX 14',weekly?'27.4':'22.6','Trend strength; does not tell you the direction.','adx']
      ])}
      ${studyGroup('Momentum','activity',[
        ['RSI 14',weekly?'54.2':'48.6','Balanced momentum; not a buy signal on its own.','rsi'],
        ['MACD',money(p*.012*multiple),'Difference between the 12- and 26-period EMAs.','macd'],
        ['MACD signal',money(p*.009*multiple),'Nine-period average of the MACD line.','macd'],
        ['Histogram','+'+(p*.003*multiple).toFixed(2),'Momentum is above its signal line in this sample.','macd']
      ])}
      ${studyGroup('Volatility & risk','shield',[
        ['ATR 14',money(p*(weekly?.071:.026)),'Typical range in price units, not a maximum loss.','atr'],
        ['ATR / price',weekly?'7.1%':'2.6%','The same range as a percentage of price.','atr'],
        ['Bollinger width',weekly?'18.6%':'11.2%','Band width indicates how much volatility is expanding.','bands'],
        ['Drawdown','−14.8%','Distance below the sample 52-week high.','drawdown']
      ])}
      ${studyGroup('Participation','chart-no-axes-combined',[
        ['Relative volume',weekly?'1.2×':'1.4×','Volume versus the average for the selected period.','volume'],
        ['OBV trend','Rising','A volume-based trend; not proof of institutional buying.','obv'],
        ['Relative strength','+6.2 pp','Sample 3-month return minus SPY over matching dates.','relative'],
        ['Bollinger %B','0.62','Price sits inside the bands, above the midpoint.','bands']
      ])}
      </div>
      <section class="au-panel"><div class="au-panel-head"><h3>Weekly context</h3>${help('weekly','weekly moving averages')}</div><div class="au-two"><div class="au-between"><span class="au-caption">50-week simple average</span><b class="au-num">${money(p*.91)}</b></div><div class="au-between"><span class="au-caption">200-week simple average</span><b class="au-num">${money(p*.62)}</b></div></div><p class="au-caption" style="margin-top:13px">Calculated from completed weekly bars. A short trading history must never produce a fabricated 200-week value.</p></section>
      <div class="au-two"><section class="au-panel"><div class="au-panel-head"><h3>Fibonacci & price levels</h3>${help('fib','Fibonacci levels')}</div>${[.236,.382,.5,.618,.686,.786].map(r=>`<div class="au-level"><span>${r.toFixed(3)}</span><i></i><b class="au-num">${money(fibValue(r))}</b><small>${r===.686?'Custom':'Retracement'}</small></div>`).join('')}<div class="au-fib-legend"><div><small>Swing low</small><b>${money(fibValue(1))}</b></div><div><small>Swing high</small><b>${money(fibValue(0))}</b></div><div><small>Anchor range</small><b>${state.range}</b></div></div><p class="au-caption" style="margin-top:13px">Anchors determine the levels. Support needs confirmation; a touched line is not a completed setup.</p></section><div class="au-stack">${dca()}<section class="au-panel"><h3>What to watch next</h3><p class="au-caption" style="margin-top:10px">A sustained reclaim with stronger participation supports this sample setup. A loss of the selected swing low weakens it.</p><div class="au-rule"></div><span class="au-chip">Context, not a trade instruction</span></section></div></div>`;
    }
    function thesisPage(){return `<div class="au-between"><div><h2>The investment case.</h2><p class="au-caption" style="margin-top:6px">A balanced view, with conditions you can follow.</p></div><button type="button" class="au-button" data-help="analyst">${icon('sparkles')}Ask AURYN</button></div>${thesis()}<section class="au-panel"><h3>What would change the view?</h3><div class="au-event">${icon('trending-up')}<div><p>The case strengthens if cash conversion improves.</p><small>Review the next two reporting periods, not a single trading day.</small></div></div><div class="au-event">${icon('shield-alert')}<div><p>The case weakens if growth requires heavy dilution.</p><small>Track shares outstanding, cash burn and the funding runway.</small></div></div>${source('Example thesis · Evidence layout')}</section><section class="au-plainsection"><div class="au-section-head"><h2>Catalysts & events</h2><span class="au-chip">Illustrative calendar</span></div><div class="au-event"><div class="au-event-date"><small>Nov</small>12</div><div><p>Next earnings review</p><small>Focus: cash conversion, guidance and reinvestment.</small></div></div><div class="au-event"><div class="au-event-date"><small>Next</small>10-Q</div><div><p>Quarterly filing</p><small>Check the reported numbers against the investment case.</small></div></div></section>`}
    function row(symbol,holdings=false){const a=securities[symbol],position=state.holdings.find(h=>h.symbol===symbol);return `<button type="button" class="au-row" data-symbol="${symbol}"><span class="au-rowname">${logo(symbol)}<span><strong>${symbol.replace('/USD','')}</strong><small>${a.name}${holdings?' · '+position.qty+' units':''}</small></span></span><span class="au-rowprice au-num">${money(holdings?position.qty*a.price:a.price)}<small class="${a.change>=0?'au-positive':'au-negative'}">${signed(a.change)}</small></span><span class="au-rowstate"><span class="au-chip ${a.pace==='4×'?'warn':a.pace==='2×'?'good':'blue'}">${a.pace} pace</span><small>${a.note}</small></span></button>`}
    const portfolioValue=()=>state.holdings.reduce((sum,h)=>sum+h.qty*securities[h.symbol].price,0)+state.cash;
    function overview(){return `<header class="au-pagehead"><span class="au-eyebrow">Your investment workspace</span><h1 style="margin-top:7px">A clearer view of what matters.</h1><p>Your portfolio, your companies, and what changed.</p></header><div class="au-stack"><div class="au-mainrail"><section class="au-panel"><div class="au-between"><span class="au-caption">Portfolio value · Sample account</span><span class="au-chip good">+8.4% this year</span></div><div class="au-total au-num" style="margin:13px 0">${money(portfolioValue())}</div>${chart('portfolio',175)}<div class="au-portfolio-summary"><div><small>Invested</small><b class="au-num">${money(portfolioValue()-state.cash,0)}</b></div><div><small>Cash available</small><b class="au-num">${money(state.cash,0)}</b></div></div></section><section class="au-panel au-stack"><span class="au-eyebrow">On your radar</span><div class="au-tight"><span class="au-chip good" style="justify-self:start">Business update</span><h3>Cash generation is improving.</h3><p class="au-caption">Open the financial trend behind the change.</p><button type="button" class="au-link" data-symbol="APP">${logo('APP')}APP ${icon('arrow-up-right')}</button></div><div class="au-rule" style="margin:0"></div><div class="au-tight"><span class="au-chip warn" style="justify-self:start">Risk to review</span><h3>Position concentration</h3><p class="au-caption">One holding is above your sample 25% position guide.</p><button type="button" class="au-link" data-page="portfolio">View exposure ${icon('arrow-up-right')}</button></div></section></div><section class="au-panel"><div class="au-panel-head"><h2>Your watchlist</h2><button type="button" class="au-link" data-page="watchlist">View all ${icon('arrow-up-right')}</button></div>${[...state.saved].slice(0,4).map(x=>row(x)).join('')}</section><section class="au-plainsection"><div class="au-section-head"><h2>Next on your calendar</h2><span class="au-caption">Sample events</span></div><div class="au-event"><div class="au-event-date"><small>Nov</small>12</div><div><p>APP · Earnings review</p><small>Cash flow, margins and the outlook.</small></div><button type="button" class="au-icon" style="margin-left:auto" data-symbol="APP" aria-label="Open AppLovin research">${icon('arrow-up-right')}</button></div></section></div>`}
    function watchlist(){return `<header class="au-pagehead au-between"><div><h1>Your watchlist.</h1><p>A useful pulse on companies you follow.</p></div><button type="button" class="au-button" data-action="focus-search">${icon('plus')}Add</button></header><section class="au-panel"><div class="au-between" style="margin-bottom:13px"><span class="au-caption">${state.saved.size} assets · Sample quotes</span><button type="button" class="au-link" data-help="dca">Pace explained ${icon('circle-help')}</button></div>${state.saved.size?[...state.saved].map(x=>row(x)).join(''):`<div class="au-empty"><h2>Make it yours.</h2><p class="au-muted">Search for a company or cryptoasset to start your list.</p><button type="button" class="au-primary" data-action="focus-search">Search assets</button></div>`}</section>`}
    function portfolio(){const total=portfolioValue(),stock=state.holdings.filter(h=>securities[h.symbol].kind==='Stock').reduce((s,h)=>s+h.qty*securities[h.symbol].price,0),crypto=total-state.cash-stock;return `<header class="au-pagehead au-between"><div><h1>Your money, clearly.</h1><p>Holdings, performance and concentration in one place.</p></div><button type="button" class="au-button" data-action="add-position">${icon('plus')}Position</button></header><div class="au-stack"><div class="au-mainrail"><section class="au-panel"><span class="au-caption">Total portfolio · Sample account</span><div class="au-total au-num" style="margin:10px 0">${money(total)}</div><p class="au-caption"><span class="au-positive">+${money(total-total/1.084)} (+8.4%)</span> · Illustrative year-to-date return</p>${chart('portfolio',190)}<div class="au-chart-foot"><span>Jan</span><span>Apr</span><span>Jul</span><span>Oct</span></div></section><section class="au-panel"><h3>Allocation</h3><div class="au-allocation"><span style="width:${stock/total*100}%;background:var(--au-blue)"></span><span style="width:${crypto/total*100}%;background:var(--au-purple)"></span><span style="width:${state.cash/total*100}%;background:var(--au-green)"></span></div><div class="au-allocation-legend">${[['Stocks',stock,'blue'],['Crypto',crypto,'purple'],['Cash',state.cash,'green']].map(([label,value,color])=>`<div class="au-between"><span><span class="au-dot" style="background:var(--au-${color})"></span>${label}</span><b class="au-num">${(value/total*100).toFixed(1)}%</b></div>`).join('')}</div><div class="au-rule"></div><span class="au-caption">Largest position</span><div class="au-flex" style="margin-top:10px">${logo('NVDA')}<div><b>NVDA</b><small style="display:block">${(state.holdings.find(h=>h.symbol==='NVDA').qty*securities.NVDA.price/total*100).toFixed(1)}% of portfolio</small></div></div></section></div><section class="au-panel"><div class="au-panel-head"><h2>Holdings</h2><span class="au-caption">Value · Daily move</span></div>${state.holdings.map(h=>row(h.symbol,true)).join('')}</section></div>`}
    function settings(){return `<header class="au-pagehead"><h1>Make AURYN yours.</h1><p>A calmer workspace, tuned to you.</p></header><div class="au-stack"><section class="au-panel"><h3>Appearance & reading</h3><div class="au-settingsrow"><div>Theme<small>Comfortable in daylight and after dark.</small></div><div class="au-segment">${['system','light','dark'].map(x=>`<button type="button" data-theme="${x}" aria-pressed="${state.theme===x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="au-settingsrow"><div>Reduced motion<small>Keep transitions still and predictable.</small></div><label class="au-check"><input type="checkbox" data-toggle="motion" ${root.dataset.reduced==='true'?'checked':''}>Enabled</label></div><div class="au-settingsrow"><div>Reporting currency<small>Keep each financial statement in its original currency.</small></div><span class="au-chip">Source currency</span></div></section><section class="au-panel"><h3>Data & intelligence</h3><div class="au-settingsrow"><div>Twelve Data<small>Proposed connection · Your existing Grow plan.</small></div><span class="au-chip blue">Preview only</span></div><div class="au-settingsrow"><div>Financial evidence<small>Filings and provider data, with dates and coverage.</small></div><button type="button" class="au-link" data-help="sources">How it works ${icon('arrow-up-right')}</button></div><div class="au-settingsrow"><div>AI research assistant<small>Source-linked explanations, with a spending limit.</small></div><span class="au-chip">Planned</span></div></section><div class="au-between"><button type="button" class="au-button" data-help="help">${icon('circle-help')}Help & methodology</button><button type="button" class="au-link" data-page="login">Preview sign-in ${icon('arrow-up-right')}</button></div></div>`}
    function login(){return `<div class="au-login"><div class="au-login-story">${brand()}<div><span class="au-eyebrow">Investment intelligence</span><h1 style="margin-top:14px">Know the business.<br>Understand the price.</h1><p class="au-muted" style="margin-top:18px">Your research, portfolio and next question. Together, in a calmer workspace.</p></div><div class="au-panel"><div class="au-flex">${logo('APP')}<div><b>AppLovin</b><small style="display:block">The business, in numbers.</small></div></div>${chart('login',160)}<div class="au-between au-caption"><span>Revenue growth</span><b class="au-positive">+26.4% · Sample</b></div></div><span class="au-caption">Evidence first. Your decisions.</span></div><div class="au-login-form"><div>${brand()}<h1 style="margin-top:27px">${state.auth==='signup'?'Your clearer view starts here.':state.auth==='reset'?'Reset your password.':'Welcome back.'}</h1><p class="au-muted" style="margin-top:9px;font-size:14px">${state.auth==='reset'?'Preview the account-recovery experience.':'A little clarity goes a long way.'}</p></div><form class="au-form" id="au-login-form">${state.auth==='signup'?'<label>Your name<input name="name" autocomplete="name" placeholder="Your name" required></label>':''}<label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>${state.auth!=='reset'?'<label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required></label>':''}<button type="submit" class="au-primary">${state.auth==='signup'?'Create account':state.auth==='reset'?'Send reset link':'Sign in'} ${icon('arrow-right')}</button></form><div class="au-between"><button type="button" class="au-link" data-auth="${state.auth==='signup'?'login':'signup'}">${state.auth==='signup'?'Already have an account?':'Create an account'}</button><button type="button" class="au-link" data-auth="reset">Forgot password?</button></div><button type="button" class="au-button" data-page="overview">Explore the preview ${icon('arrow-up-right')}</button><p class="au-caption">Design preview. No credentials are sent or saved.</p></div></div>`}
    const explanations={averages:['Moving averages','EMA places more weight on recent closes. SMA weights each included close equally. The selected timeframe changes what a period means. Compare averages only after enough completed observations.'],adx:['Trend strength','ADX measures the strength of a trend; a high value can accompany a rising or falling market. The production formula needs consistent high, low and close data.'],macd:['MACD, signal and histogram','MACD is the 12-period EMA minus the 26-period EMA. Its nine-period EMA is the signal line. The histogram is their difference. All three belong to one calculation, not three independent votes.'],atr:['Average true range','ATR summarizes true ranges using highs, lows and the previous close. ATR as a percent of price helps compare differently priced assets. It is not a downside guarantee or a position-size instruction.'],bands:['Bollinger Bands','The standard example uses a 20-period average plus or minus two standard deviations. Bandwidth measures the distance between bands relative to the midpoint. Percent B locates price between the lower and upper band.'],drawdown:['Drawdown','The decline from a specified historical high. The lookback and availability of price history must be shown; a new listing does not have a full 52-week record.'],volume:['Relative volume','Compare volume with an explicitly defined historical average. Intraday comparisons must use comparable elapsed trading time. Exchange-level crypto volume must not be presented as all-market volume.'],obv:['On-balance volume','OBV adds or subtracts volume according to the close-to-close direction. It is a price-volume measure and cannot identify institutional or whale buying.'],relative:['Relative strength versus a benchmark','Here, relative strength means the asset’s return minus SPY’s return over the same dates, expressed in percentage points. It is different from RSI. Crypto needs a clearly selected benchmark and matching timestamps.'],weekly:['Weekly averages','These are simple averages of 50 or 200 completed weekly closes. WMA is ambiguous: it sometimes means weighted moving average, so AURYN will spell out the period and calculation.'],dca:['A pace, not a promise.','1× means your normal investing pace. 2× and 4× are multiples of that baseline—not leverage or predicted returns. This preview shows example zones only. A production signal needs documented rules, settled prices, sufficient history and honest historical testing. Company quality, position risk and affordability remain separate.'],revenue:['Revenue','The amount the business earns from selling its products and services before expenses. Compare the same reporting period and currency. This preview uses illustrative values.'],fcf:['Free cash flow','Operating cash flow minus the specified capital expenditure measure. It shows cash remaining after that investment. AURYN must display the formula and source fields; missing capex must never be silently treated as zero.'],margin:['Free cash flow margin','Free cash flow divided by revenue for the same period. Higher is not automatically better: cash needs, working capital and the business model matter.'],cash:['Cash & equivalents','Cash and qualifying liquid holdings at the reporting date. This is a balance-sheet value, not a flow to add across quarters.'],debt:['Total debt','The included borrowing obligations at the reporting date. Show the underlying definition and distinguish gross debt from debt net of cash.'],shares:['Diluted shares','Share counts help reveal dilution or buybacks. Weighted-average shares used for earnings per share are different from shares outstanding at a point in time.'],valuation:['An assumption-driven scenario','This example compounds $5.00 EPS for five years, applies an exit P/E and discounts at 10%. The bear/base/bull spread is illustrative, not an analyst forecast or confidence interval. Actual models must reflect the company, share type and source currency.'],fib:['Fibonacci & custom retracements','0.5, 0.618 and 0.786 are commonly used retracement levels; 0.686 is a custom level. Levels depend on explicit swing anchors. Touching a line does not establish support or predict a reversal.'],rsi:['Relative strength index','RSI summarizes recent gains versus losses on a 0–100 scale. It is a momentum measure, not a standalone buy or sell instruction.'],sources:['Trace every important number','The production design will show provider, report date, period, currency, formula and source link beside the evidence. All numbers in this prototype are sample data. Actual data availability and plan permissions determine which fields can populate.'],analyst:['Ask AURYN · Proposed experience','Questions such as “What changed?”, “What breaks this thesis?” and “Why did cash flow fall?” should receive short answers linked to the underlying evidence. This preview does not call an AI model. Paid AI or MCP connections are not enabled.'],help:['Simple to read. Deep when needed.','Start with the snapshot. Open Financials for trends and statements, Valuation for explicit assumptions, Technicals for market structure, and Thesis for the bull/bear case and catalysts. Blue actions navigate; the small help icons explain definitions.']};
    function modal(){if(!state.modal)return '';if(state.modal==='position')return `<div class="au-modalback"><section class="au-dialog" role="dialog" aria-modal="true" aria-labelledby="au-modal-heading"><div class="au-between"><h2 id="au-modal-heading">Add a sample position</h2><button type="button" class="au-icon" data-action="close" aria-label="Close position editor">${icon('x')}</button></div><p>This only changes the preview portfolio.</p><form id="au-position-form" class="au-form" style="margin-top:20px"><label>Asset<select name="symbol">${Object.keys(securities).map(x=>`<option value="${x}">${x} · ${securities[x].name}</option>`).join('')}</select></label><label>Units<input type="number" name="qty" min="0.000001" step="any" value="1" required></label><label>Average cost per unit · USD<input type="number" name="cost" min="0.01" step="any" value="100" required></label><button type="submit" class="au-primary">Add position</button></form></section></div>`;const [heading,body]=explanations[state.modal]||explanations.help;return `<div class="au-modalback"><section class="au-dialog" role="dialog" aria-modal="true" aria-labelledby="au-modal-heading"><div class="au-between"><h2 id="au-modal-heading">${heading}</h2><button type="button" class="au-icon" data-action="close" aria-label="Close explanation">${icon('x')}</button></div><p>${body}</p><button type="button" class="au-button" data-action="close" style="margin-top:20px">Got it</button></section></div>`}
    let resize;
    function render(){if(resize)resize.disconnect();root.style.colorScheme=state.theme==='system'?'light dark':state.theme;product.innerHTML=state.page==='login'?login()+modal():`<div class="au-shell"><aside class="au-sidebar">${brand()}<nav class="au-side-nav" aria-label="Main navigation">${navMarkup()}</nav><div class="au-sidebar-bottom"><nav class="au-side-nav"><button type="button" data-page="settings" ${state.page==='settings'?'aria-current="page"':''}>${icon('sliders-horizontal')}Preferences</button><button type="button" data-help="help">${icon('circle-help')}Help</button></nav><div class="au-flex" style="padding:8px"><span class="au-profile">AP</span><div style="font-size:12px">Anudeep<small style="display:block;font-size:10px">Personal workspace</small></div></div></div></aside><div class="au-workspace"><div class="au-mobilebrand">${brand()}<button type="button" class="au-icon" data-page="settings" aria-label="Open preferences">${icon('sliders-horizontal')}</button></div><header class="au-topbar"><div class="au-search">${icon('search')}<input id="au-search" type="search" placeholder="Search companies or crypto" aria-label="Search sample companies or crypto" autocomplete="off" aria-controls="au-search-results" aria-expanded="false"><div id="au-search-results" class="au-searchresults" hidden></div></div><div class="au-top-actions"><span class="au-caption"><span class="au-healthdot"></span> Sample workspace</span><button type="button" class="au-icon" data-help="analyst" aria-label="Ask AURYN">${icon('sparkles')}</button><button type="button" class="au-profile" data-page="settings" aria-label="Account preferences">AP</button></div></header>${state.toast?`<div class="au-toast" role="status">${state.toast}</div>`:''}<main class="au-body">${({overview,watchlist,portfolio,settings,research}[state.page]||research)()}</main><footer class="au-footer"><span>Design preview · All values are illustrative.</span><span>AURYN · Your decisions, better informed.</span></footer><div class="au-dockwrap"><nav class="au-mobile-nav" aria-label="Mobile navigation">${navMarkup()}</nav><div class="au-home-indicator" aria-hidden="true"></div></div></div></div>${modal()}`;if(window.lucide)window.lucide.createIcons({attrs:{width:17,height:17,'stroke-width':1.7}});root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));drawCharts();resize=new ResizeObserver(()=>drawCharts());root.querySelectorAll('.au-chart').forEach(el=>resize.observe(el));bindForms();if(state.modal){product.querySelector('.au-modalback')?.scrollIntoView({block:'nearest'});product.querySelector('.au-modalback button')?.focus()}}
    function sequence(length,base,type='price'){return Array.from({length},(_,i)=>{const t=i/(length-1);return base*(type==='portfolio'?1/1.084+(1-1/1.084)*t+.008*Math.sin(i*.9):.65+.35*t+.065*Math.sin(i*.73)+.026*Math.cos(i*1.91))}).map((v,i,arr)=>i===arr.length-1?base:v)}
    function drawCharts(){root.querySelectorAll('.au-chart').forEach(el=>{const width=Math.max(120,Math.round(el.getBoundingClientRect().width)),height=Number(el.dataset.height),type=el.dataset.chart,left=type==='bars'?0:2,right=type==='bars'?0:42,top=16,bottom=type==='bars'?23:25,w=width-left-right,h=height-top-bottom;let values,labels,m=null;if(type==='bars'){m=metricData().find(x=>x.key===el.dataset.metric);values=m.series.map(v=>v/Math.abs(m.series.at(-1))*Number(m.value.replace(/[BM%]/g,'')));labels=state.period==='Quarterly'?['Q1','Q2','Q3','Q4','Q1','Q2']:['20','21','22','23','24','25'];}else{const base=type==='portfolio'?portfolioValue():type==='login'?100:securities[state.symbol].price;const length=state.range==='1D'?32:state.range==='1W'?30:state.range==='1M'?28:60;values=sequence(length,base,type);if(state.range==='1D')values=values.map((v,i)=>base+((v/base)-1)*base*.06);if(state.range==='1W')values=values.map(v=>base+(v-base)*.2);if(state.range==='1M')values=values.map(v=>base+(v-base)*.4);labels=state.range==='1D'?['09:30','12:30','16:00']:state.range==='1W'?['Mon','Wed','Fri']:state.range==='1M'?['Week 1','Week 2','Week 4']:state.range==='5Y'?['2021','2023','2026']:['May','Jul','Oct'];}
      const min=type==='bars'?Math.min(0,...values)*1.1:Math.min(...values)*.96,max=type==='bars'?Math.max(0,...values)*1.13:Math.max(...values)*1.03,span=Math.max(.0001,max-min),x=i=>left+i/(values.length-1)*w,y=v=>top+h-(v-min)/span*h;let marks='',grid='',axis='';
      if(type==='bars'){const bw=w/values.length*.57;marks=values.map((v,i)=>`<rect x="${i*w/values.length+(w/values.length-bw)/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="3" class="au-bar" opacity="${.35+.65*i/(values.length-1)}"><title>${labels[i]}: ${m.unit}${v.toFixed(2)}${m.value.endsWith('%')?'%':m.value.endsWith('B')?'B':'M'}</title></rect>`).join('');axis=labels.map((v,i)=>`<text x="${(i+.5)*w/values.length}" y="${height-5}" text-anchor="middle">${width<150&&i%2?'':v}</text>`).join('');}
      else{const d='M'+values.map((v,i)=>`${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' L'),id='au-grad-'+type;grid=[0,.5,1].map(t=>{const v=min+t*span,yy=y(v);return `<line x1="${left}" y1="${yy}" x2="${left+w}" y2="${yy}" class="au-gridline"/><text x="${width-1}" y="${yy+4}" text-anchor="end">${v>=10000?(v/1000).toFixed(0)+'k':v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`}).join('');marks=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--au-blue)" stop-opacity=".22"/><stop offset="1" stop-color="var(--au-blue)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${x(values.length-1)},${top+h} L${left},${top+h} Z" fill="url(#${id})"/><path d="${d}" fill="none" class="au-chartline" stroke-width="2.25" stroke-linejoin="round"/><circle cx="${x(values.length-1)}" cy="${y(values.at(-1))}" r="3.5" fill="var(--au-blue)"/>`;axis=labels.map((v,i)=>`<text x="${left+i/(labels.length-1)*w}" y="${height-4}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${v}</text>`).join('');
        if(type==='technical'&&state.fib){[.5,.618,.686,.786].forEach((r,i)=>{const yy=y(Math.max(...values)-(Math.max(...values)-Math.min(...values))*r);marks+=`<line x1="${left}" y1="${yy}" x2="${left+w}" y2="${yy}" class="au-fib"/><text x="${left+5}" y="${yy-5}" class="au-fib-text">${r.toFixed(3)}</text>`})}if(type==='technical'&&state.ma){const smooth=values.map((_,i)=>{const a=values.slice(Math.max(0,i-9),i+1);return a.reduce((s,v)=>s+v,0)/a.length});marks+=`<path d="M${smooth.map((v,i)=>`${x(i)},${y(v)}`).join(' L')}" fill="none" stroke="var(--au-amber)" stroke-width="1.5"/>`}
      }
      el.innerHTML=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${type==='bars'?m.label+' illustrative trend':type==='portfolio'?'Illustrative portfolio history in USD':'Illustrative '+state.range+' price history in USD'}">${grid}${marks}${axis}<rect x="0" y="0" width="${width}" height="${height-bottom}" class="au-inspect"/></svg>${type!=='bars'&&type!=='login'?'<div class="au-chart-readout" aria-live="polite">Sample history · Hover or tap a point</div>':''}`;
      const show=(e)=>{const idx=Math.max(0,Math.min(values.length-1,Math.round((e.clientX-el.getBoundingClientRect().left-left)/w*(values.length-1))));const readout=el.querySelector('.au-chart-readout');if(readout)readout.textContent=`Sample point ${idx+1} of ${values.length} · ${money(values[idx])}`};el.onpointermove=show;el.onclick=show;
    })}
    function search(query){const box=root.querySelector('#au-search-results'),input=root.querySelector('#au-search');if(!box)return;const q=query.trim().toLowerCase();const results=Object.keys(securities).filter(s=>!q||s.toLowerCase().includes(q)||securities[s].name.toLowerCase().includes(q));box.hidden=false;input.setAttribute('aria-expanded','true');box.innerHTML=results.length?results.map(s=>`<button type="button" data-symbol="${s}">${logo(s)}<span><b>${s}</b><small>${securities[s].name}</small></span><span class="au-chip">${securities[s].kind}</span></button>`).join(''):'<div class="au-empty"><b>No sample match</b><span class="au-caption">Try APP, SAP, HIMS, BTC or ETH.</span></div>';}
    let priorFocus;
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const d=b.dataset;if(d.device){state.device=d.device;root.querySelector('#au-frame').classList.toggle('au-phone',d.device==='phone');root.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.device===d.device)));drawCharts();return}if(d.action==='theme'){const dark=state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches;state.theme=dark?'light':'dark';render();return}if(d.theme){state.theme=d.theme;render();return}if(d.action==='focus-search'){const input=root.querySelector('#au-search');if(input){input.focus();search('')}return}if(d.action==='save'){state.saved.has(state.symbol)?state.saved.delete(state.symbol):state.saved.add(state.symbol);render();return}if(d.action==='close'){state.modal=null;render();const focusSelector=priorFocus?.dataset.help?`[data-help="${priorFocus.dataset.help}"]`:'[data-action="add-position"]';product.querySelector(focusSelector)?.focus();return}if(d.help||d.action==='add-position'){priorFocus=b;state.modal=d.help||'position';render();return}if(d.page){state.page=d.page;state.toast='';state.modal=null;render();return}if(d.symbol){state.symbol=d.symbol;state.page='research';state.tab='Snapshot';state.toast='';render();return}if(d.techframe){state.techFrame=d.techframe;render();return}if(d.tab){state.tab=d.tab;render();return}if(d.range){state.range=d.range;render();return}if(d.period){state.period=d.period;render();return}if(d.category){state.category=d.category;render();return}if(d.auth){state.auth=d.auth;render();return}});
    root.addEventListener('input',e=>{if(e.target.id==='au-search')search(e.target.value);if(e.target.dataset.slider){const growth=e.target.dataset.slider==='growth';state[growth?'valuationGrowth':'valuationMultiple']=Number(e.target.value);const base=5*Math.pow(1+state.valuationGrowth/100,5)*state.valuationMultiple/Math.pow(1.1,5);root.querySelector('#au-growth-label').textContent=state.valuationGrowth+'%';root.querySelector('#au-multiple-label').textContent=state.valuationMultiple+'×';root.querySelector('#au-base-value').textContent=money(base,0);root.querySelector('#au-center-value').textContent=money(base,0);root.querySelector('#au-bear-value').textContent=money(base*.72,0);root.querySelector('#au-bull-value').textContent=money(base*1.24,0)}});
    root.addEventListener('change',e=>{const key=e.target.dataset.toggle;if(key==='motion')root.dataset.reduced=String(e.target.checked);else if(key){state[key]=e.target.checked;drawCharts()}});
    root.addEventListener('focusin',e=>{if(e.target.id==='au-search')search(e.target.value)});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;render()}const box=root.querySelector('#au-search-results');if(box)box.hidden=true;root.querySelector('#au-search')?.setAttribute('aria-expanded','false')}if(e.key==='Enter'&&e.target.id==='au-search'){e.preventDefault();root.querySelector('#au-search-results button')?.click()}if(e.key==='Tab'&&state.modal){const dialog=product.querySelector('.au-dialog'),items=dialog.querySelectorAll('button,input,select'),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    root.addEventListener('pointerdown',e=>{if(!e.target.closest('.au-search')){const box=root.querySelector('#au-search-results');if(box)box.hidden=true;root.querySelector('#au-search')?.setAttribute('aria-expanded','false')}});
    function bindForms(){const loginForm=root.querySelector('#au-login-form');if(loginForm)loginForm.addEventListener('submit',e=>{e.preventDefault();if(state.auth==='reset'){state.auth='login';state.page='overview';state.toast='Preview only: no password-reset email was sent.'}else{state.page='overview';state.toast='Preview workspace opened. No account was created and no credentials were sent.'}render()});const position=root.querySelector('#au-position-form');if(position)position.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(position),symbol=String(data.get('symbol')),qty=Number(data.get('qty')),cost=Number(data.get('cost'));if(!securities[symbol]||!Number.isFinite(qty)||!Number.isFinite(cost)||qty<=0||cost<=0)return;const existing=state.holdings.find(x=>x.symbol===symbol);if(existing){existing.cost=(existing.cost*existing.qty+cost*qty)/(existing.qty+qty);existing.qty+=qty}else state.holdings.push({symbol,qty,cost});state.modal=null;state.toast='Sample holding added to this preview only.';render()})}
