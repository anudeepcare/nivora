function chart(s,range=state.range,technical=false,compact=false){const values=series(s,range),d=data[s],w=680,h=240,x0=4,x1=607,y0=14,y1=200;let min=Math.min(...values)*.97,max=Math.max(...values)*1.03;if(technical&&state.fib){min=Math.min(min,d.lo*.97);max=Math.max(max,d.hi*1.03)}const y=v=>y1-(v-min)/(max-min)*(y1-y0),x=i=>x0+i/(values.length-1)*(x1-x0);const coords=values.map((v,i)=>x(i).toFixed(2)+','+y(v).toFixed(2)),line='M'+coords.join(' L');const id='g-'+s.replace(/\W/g,'')+'-'+range;let grid='',overlay='';for(let i=0;i<4;i++){let v=min+(max-min)*i/3,yy=y(v);grid+='<line x1="0" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="var(--line)" stroke-dasharray="3 5" opacity=".65"/><text x="621" y="'+(yy+4)+'">'+(v>1000?(v/1000).toFixed(1)+'k':v.toFixed(v<10?2:0))+'</text>'}
 if(technical&&state.fib){[.5,.618,.686,.786].forEach((ratio,i)=>{let v=d.hi-(d.hi-d.lo)*ratio,yy=y(v);overlay+='<line x1="0" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="'+(i===1?'var(--teal)':'var(--purple)')+'" stroke-dasharray="5 5" opacity=".7"/><text class="fib-label" x="8" y="'+(yy-5)+'" style="fill:'+(i===1?'var(--teal)':'var(--purple)')+';font-size:11px">'+ratio+' · '+money(v)+'</text>'})}
 if(technical&&state.ma){let smooth=values.map((_,i)=>{const slice=values.slice(Math.max(0,i-10),i+1);return slice.reduce((a,b)=>a+b,0)/slice.length});overlay+='<path d="M'+smooth.map((v,i)=>x(i).toFixed(2)+','+y(v).toFixed(2)).join(' L')+'" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="6 4"/>'}
let labels={'1D':['09:30','11:00','12:30','14:00','16:00'],'1W':['Mon','Tue','Wed','Thu','Fri'],'1M':['Week 1','Week 2','Week 3','Week 4','Month end'],'6M':['May','Jun','Jul','Aug','Sep'],'1Y':['Oct','Jan','Apr','Jul','Sep'],'5Y':['Year 1','Year 2','Year 3','Year 4','Year 5']}[range];if(d.kind==='Crypto'&&range==='1D')labels=['00:00','06:00','12:00','18:00','24:00'];let axis=labels.map((v,i)=>'<text x="'+(i*150)+'" y="231" text-anchor="'+(i===0?'start':i===4?'end':'middle')+'">'+v+'</text>').join('');return '<div class="chart-wrap" data-chart="'+s+'" data-range="'+range+'"><div class="chart-tooltip" hidden></div><svg class="price-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Illustrative '+range+' price chart for '+d.name+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+d.color+'" stop-opacity=".27"/><stop offset="1" stop-color="'+d.color+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+line+' L'+x1+','+y1+' L0,'+y1+'Z" fill="url(#'+id+')"/>'+overlay+'<path d="'+line+'" fill="none" stroke="'+d.color+'" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="'+x1+'" cy="'+y(d.price)+'" r="4.5" fill="'+d.color+'" stroke="var(--surface)" stroke-width="2"/>'+axis+'</svg></div>'}
function ranges(){return '<div class="range" role="group" aria-label="Chart range">'+['1D','1W','1M','6M','1Y','5Y'].map(r=>'<button data-range="'+r+'" aria-pressed="'+(state.range===r)+'" class="'+(state.range===r?'active':'')+'">'+r+'</button>').join('')+'</div>'}
function chartPanel(d,tech=false){return '<section class="panel"><div class="panel-head"><h2>Price & trend</h2>'+ranges()+'</div>'+(tech?'<div class="check-row"><label><input type="checkbox" data-overlay="fib" '+(state.fib?'checked':'')+'> Fibonacci levels</label><label><input type="checkbox" data-overlay="ma" '+(state.ma?'checked':'')+'> Trend average</label></div>':'')+chart(d.ticker,state.range,tech)+'<div class="chart-foot"><span class="chart-legend"><i></i>'+d.ticker+' · USD</span><span>Illustrative history · Hover or tap</span></div></section>'}
function miniChart(color,type='bar',negative=false){let vals=[20,28,32,44,50,66],out='';if(negative)vals=[64,55,48,39,30,18];if(type==='bar'){out=vals.map((v,i)=>'<rect x="'+(i*39+6)+'" y="'+(70-v)+'" width="23" height="'+v+'" rx="3" fill="'+color+'" opacity="'+(.5+i*.1)+'"/>').join('')}else{const points=vals.map((v,i)=>(i*43+8)+','+(74-v));out='<path d="M'+points.join(' L')+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>'+vals.map((v,i)=>'<circle cx="'+(i*43+8)+'" cy="'+(74-v)+'" r="3.5" fill="'+color+'"/>').join('')}return '<svg class="mini-chart" viewBox="0 0 240 84" preserveAspectRatio="none" role="img" aria-label="Illustrative six-period trend">'+out+'</svg>'}
function financialCards(d){return '<div class="financial-grid">'+[['Revenue',d.revenue,'var(--blue)','bar',d.revgrowth],['Free cash flow',d.fcf,'var(--teal)','line',d.fcfgrowth],['Operating margin',d.margin,'var(--purple)','line',2.1]].map(([label,value,color,type,growth])=>'<section class="panel mini-metric"><div class="label">'+label+help(label)+'</div><div class="metric-number num">'+(label==='Operating margin'?value.toFixed(1)+'%':money(value,1)+'B')+'</div><small class="'+(growth<0?'negative':'positive')+'">'+(growth>=0?'+':'')+growth.toFixed(1)+(label==='Operating margin'?' pp':'%')+' YoY</small>'+miniChart(color,type,value<0)+'<div class="mini-caption"><span>Example annual trend</span><span>6 periods</span></div></section>').join('')+'</div>'}
function brief(d){return '<section class="panel brief"><div class="panel-head"><h2>The thesis, in three points</h2>'+help('Thesis')+'</div>'+[['Strength',d.strength,'up','positive'],['Risk',d.risk,'risk','amber'],['Watch next',d.watch,'spark','purple']].map(([title,body,ic,cl])=>'<div class="brief-item"><span class="brief-icon '+cl+'">'+icon(ic)+'</span><div><b class="'+cl+'">'+title+'</b><p>'+body+'</p></div></div>').join('')+'</section>'}
function decision(d){const long=state.horizon==='Long term';let headline=long?d.headline:(d.timing==='Extended'?'Momentum is stretched. Avoid chasing.':d.timing==='Volatile'?'Price is volatile. Wait for a clear setup.':'The setup needs price confirmation.');let summary=long?d.summary:'Use support, trend and volatility to plan the entry. This view does not replace the long-term company thesis.';return '<section class="decision"><div class="decision-heading"><span class="chip '+(long&&d.dca>0?'green':'amber')+'">'+(long?d.view:'Wait for confirmation')+'</span><div class="horizon-switch" role="group" aria-label="Research horizon">'+['Long term','Near term'].map(x=>'<button data-horizon="'+x+'" class="'+(state.horizon===x?'active':'')+'" aria-pressed="'+(state.horizon===x)+'">'+x+'</button>').join('')+'</div></div><h2>'+headline+'</h2><p>'+summary+'</p><div class="signals">'+[[d.kind==='Crypto'?'Asset type':'Business quality',d.quality,'positive','Business quality'],['Valuation',d.kind==='Crypto'?'Not applicable':d.value,'amber','Valuation'],['Entry timing',d.timing,'blue','Entry timing'],['Monthly DCA',d.dca+'× '+(d.dca===0?'Pause':d.dca===1?'Baseline':'Accumulate'),'purple','Monthly DCA']].map(([label,value,cl,key])=>'<div class="signal"><div class="signal-label">'+label+help(key)+'</div><div class="signal-value '+cl+'">'+(key==='Monthly DCA'?'<button data-tab="DCA">'+value+icon('chevron')+'</button>':value)+'</div></div>').join('')+'</div></section>'}
function renderResearch(){const d=data[state.symbol],tabs=d.kind==='Crypto'?['Overview','Technicals','DCA']:['Overview','Financials','Valuation','Technicals','DCA'];if(!tabs.includes(state.tab))state.tab='Overview';return '<div class="stock-head"><div class="stock-identity">'+logo(d.ticker,true)+'<div><h1>'+d.name+'</h1><p>'+d.ticker+' · '+d.exchange+'</p></div></div><div class="stock-price"><strong class="num">'+money(d.price)+'</strong><span class="'+(d.change>=0?'positive':'negative')+'">'+pct(d.change)+' <span class="muted">example day</span></span></div><button class="icon-btn '+(state.saved.has(d.ticker)?'blue':'')+'" data-action="save" aria-label="'+(state.saved.has(d.ticker)?'Remove from':'Add to')+' watchlist" aria-pressed="'+state.saved.has(d.ticker)+'">'+icon(state.saved.has(d.ticker)?'check':'bookmark')+'</button></div><nav class="tabs" aria-label="Research sections">'+tabs.map(t=>'<button data-tab="'+t+'" class="'+(state.tab===t?'active':'')+'" aria-current="'+(state.tab===t?'page':'false')+'">'+t+'</button>').join('')+'</nav>'+researchContent(d)+notice()}
function researchContent(d){if(state.tab==='Overview')return decision(d)+'<div class="research-grid">'+chartPanel(d)+brief(d)+'</div>'+(d.kind==='Equity'?'<div class="section-title"><h2>The business at a glance</h2><button class="button quiet" data-tab="Financials">Financials '+icon('arrow')+'</button></div>'+financialCards(d):'<div class="section-title"><h2>Price context</h2><button class="button quiet" data-tab="Technicals">Technicals '+icon('arrow')+'</button></div><div class="technical-metrics"><div><span>RSI '+help('RSI')+'</span><strong>'+d.rsi+'</strong></div><div><span>Entry timing</span><strong class="blue">'+d.timing+'</strong></div><div><span>Monthly DCA</span><strong class="purple">'+d.dca+'×</strong></div></div>');
 if(state.tab==='Financials')return '<div class="sub-intro"><h2>Growth that turns into cash.</h2><p>See the business trend before digging into the numbers. These are illustrative financials.</p></div>'+financialCards(d)+'<section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Financial snapshot</h2><span class="chip">Example annual · USD</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Metric</th><th>Prior year</th><th>Latest year</th><th>Change</th></tr></thead><tbody>'+[['Revenue',money(d.revenue/(1+d.revgrowth/100),1)+'B',money(d.revenue,1)+'B','+'+d.revgrowth.toFixed(1)+'%'],['Free cash flow',money(d.fcf/(1+d.fcfgrowth/100),1)+'B',money(d.fcf,1)+'B',(d.fcfgrowth>0?'+':'')+d.fcfgrowth+'%'],['Operating margin',(d.margin-2.1).toFixed(1)+'%',d.margin.toFixed(1)+'%','+2.1 pp']].map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>';
 if(state.tab==='Valuation')return valuation(d);
 if(state.tab==='Technicals')return technical(d);
 return dca(d)
}
function valuation(d){const base=(d.fair[0]+d.fair[1])/2,scenario={Bear:{price:base*.76,growth:'6%',margin:'30%',discount:'11%'},Base:{price:base,growth:'10%',margin:'34%',discount:'9%'},Bull:{price:base*1.25,growth:'14%',margin:'38%',discount:'8%'}}[state.scenario];return '<div class="sub-intro"><h2>A range of outcomes. A clearer price.</h2><p>Change the assumptions to see how sensitive the estimate is. No single target is certain.</p></div><div class="research-grid"><section class="panel"><div class="between"><h2>Illustrative fair-value range</h2>'+help('Valuation')+'</div><div class="metric-number num">'+money(d.fair[0],0)+'–'+money(d.fair[1],0)+'</div><span class="muted">Per share · Example base case</span><div class="valuation-track"><span class="value-pin" style="left:'+Math.max(10,Math.min(90,50+(d.price-base)/base*100))+'%">Price '+money(d.price)+'</span></div><div class="valuation-labels"><span>More attractive</span><span>Near fair value</span><span>More demanding</span></div><div class="scenarios">'+['Bear','Base','Bull'].map((s,i)=>'<button class="scenario '+(state.scenario===s?'active':'')+'" data-scenario="'+s+'" aria-pressed="'+(state.scenario===s)+'">'+s+' case<strong>'+money(base*[.76,1,1.25][i],0)+'</strong><small>Inspect assumptions</small></button>').join('')+'</div></section><section class="panel"><div class="panel-head"><h2>'+state.scenario+' case assumptions</h2><span class="chip">Example</span></div>'+[['Revenue growth',scenario.growth],['Cash-flow margin',scenario.margin],['Discount rate',scenario.discount],['Scenario value',money(scenario.price,0)]].map(([a,b])=>'<div class="model-row"><span class="muted">'+a+'</span><strong>'+b+'</strong></div>').join('')+'<p class="inline-note">This interaction demonstrates how the model should be explained. These inputs are not a live DCF calculation.</p></section></div>'}
function technical(d){return '<div class="sub-intro"><h2>See the setup, not just the price.</h2><p>Support, trend and momentum together. Scroll normally over the chart; no wheel or pinch zoom.</p></div><div class="technical-grid">'+chartPanel(d,true)+'<section class="panel"><div class="panel-head"><h2>Fibonacci levels</h2>'+help('Fibonacci')+'</div><div class="levels">'+[.236,.382,.5,.618,.686,.786].map(r=>'<div class="level '+(r===.618?'selected':'')+'"><span>'+r.toFixed(3).replace(/0$/,'')+(r===.686?' · Custom':'')+'</span><strong class="num">'+money(d.hi-(d.hi-d.lo)*r)+'</strong></div>').join('')+'</div><p class="small" style="margin-top:14px">Example swing: '+money(d.lo)+' low → '+money(d.hi)+' high. Support remains unconfirmed.</p></section></div><div class="technical-metrics"><div><span>RSI · 14 periods '+help('RSI')+'</span><strong>'+d.rsi+'</strong></div><div><span>50-week average</span><strong class="num">'+money(d.price*.94)+'</strong></div><div><span>200-week average</span><strong class="num">'+money(d.price*.72)+'</strong></div></div>'}
function dca(d){return '<section class="panel"><div class="dca-hero"><div class="dca-orb"><b>'+d.dca+'×</b><small>Confirmed</small></div><div><span class="eyebrow">Monthly accumulation</span><h2 style="margin-top:7px">'+(d.dca===0?'Pause new contributions':d.dca===1?'Keep your normal pace':'Increase your usual contribution')+'</h2><p class="muted">'+(d.dca===0?'The example zone favors patience.':d.dca===1?'Your usual scheduled amount. No amount entry needed.':d.dca+' times your baseline, only within your risk limit.')+'</p></div></div><div class="zone-scale" aria-label="DCA zone scale">'+[['0×','Pause'],['1×','Baseline'],['2×','Build'],['3×','Increase'],['4×','Highest']].map(([n,label],i)=>'<div class="zone '+(i===d.dca?'active':'')+'"'+(i===d.dca?' aria-current="true"':'')+'><b>'+n+'</b><span>'+label+'</span></div>').join('')+'</div><div class="between"><span class="chip purple">Last completed month · '+d.dca+'×</span>'+help('DCA confirmation')+'</div><div class="timeline">'+['Apr','May','Jun','Jul','Aug','Sep'].map((m,i)=>'<div><small>'+m+'</small><b>'+[1,2,2,1,d.dca,d.dca][i]+'×</b></div>').join('')+'</div><div class="dca-explain"><div><h3>Confirmed vs forming</h3><p>The confirmed zone stays fixed. This month is forming at <strong class="purple">'+Math.min(4,d.dca+1)+'×</strong> in the example and may change before the close.</p></div><div><h3>A multiplier, not a promise</h3><p>2×–4× describes contribution size. It does not predict returns or override business risk and portfolio concentration.</p></div></div></section><div class="section-title"><h2>The price context</h2><span class="small">Illustrative history</span></div>'+chartPanel(d)}
function spark(s){const v=series(s,'1M'),min=Math.min(...v),max=Math.max(...v);return '<svg class="asset-spark" viewBox="0 0 120 38" preserveAspectRatio="none" aria-hidden="true"><path d="M'+v.map((n,i)=>(i*120/(v.length-1)).toFixed(1)+','+(34-(n-min)/(max-min)*28).toFixed(1)).join(' L')+'" fill="none" stroke="'+data[s].color+'" stroke-width="2"/></svg>'}
function assetRows(symbols,remove=false){return symbols.map(s=>{const d=data[s];return '<div class="asset-row"><button class="asset-open asset-name" data-stock="'+s+'">'+logo(s)+'<span><b>'+d.name+'</b><small>'+s+'</small></span></button>'+spark(s)+'<div class="asset-price num">'+money(d.price)+'<small class="'+(d.change>=0?'positive':'negative')+'">'+pct(d.change)+'</small></div><div class="asset-status"><span class="chip '+(d.dca?'green':'amber')+'">'+d.dca+'× '+(d.dca?'DCA':'Pause')+'</span></div><button class="icon-btn" '+(remove?'data-remove="'+s+'" aria-label="Remove '+d.name+' from watchlist"':'data-stock="'+s+'" aria-label="Research '+d.name+'"')+'>'+icon(remove?'close':'chevron')+'</button></div>'}).join('')}
function totals(){const total=state.positions.reduce((a,p)=>a+p.quantity*data[p.symbol].price,0),cost=state.positions.reduce((a,p)=>a+p.quantity*p.cost,0);return {total,cost,gain:total-cost,change:cost?(total-cost)/cost*100:0}}
function renderOverview(){const t=totals();return '<div class="page-head"><span class="eyebrow">Your investing workspace</span><h1 style="margin-top:7px">Clarity for your next move.</h1><p>Start with your holdings. Follow the thesis. Keep the noise out.</p></div><section class="panel overview-hero"><div><span class="muted">Example portfolio</span><div class="balance num">'+money(t.total)+'</div><span class="'+(t.gain>=0?'positive':'negative')+'">'+money(t.gain)+' · '+pct(t.change)+' <small>unrealized</small></span><div class="mini-stats"><div><strong>'+state.positions.length+'</strong><span>Positions</span></div><div><strong>'+state.saved.size+'</strong><span>Following</span></div><div><strong class="purple">USD</strong><span>Display currency</span></div></div></div><div>'+chart('MSFT','1Y')+'<p class="small">Illustrative trend · Not calculated portfolio performance</p></div></section><div class="section-title"><h2>On your radar</h2><button class="button quiet" data-page="watchlist">Watchlist '+icon('arrow')+'</button></div><section class="panel">'+assetRows([...state.saved].slice(0,4))+'</section><div class="section-title"><h2>A closer look</h2></div><section class="decision"><div class="between"><div><span class="chip blue">Research example · IREN</span><h2>Growth story. Different kinds of risk.</h2><p>Explore the business case, price setup and accumulation zone in one view.</p></div><button class="icon-btn" data-stock="IREN" aria-label="Research IREN">'+icon('arrow')+'</button></div></section>'+notice()}
function renderWatchlist(){return '<div class="page-head between"><div><h1>Your watchlist</h1><p>'+state.saved.size+' example assets · Price, setup and DCA together.</p></div><button class="button primary" data-action="search">'+icon('plus')+'<span>Add</span></button></div><section class="panel">'+(state.saved.size?assetRows([...state.saved],true):'<div class="empty"><h2>A focused list starts here.</h2><p>Search an example asset and save it to follow it.</p><button class="button primary" data-action="search">Find an asset</button></div>')+'</section>'+notice()}
function renderPortfolio(){const t=totals();const equities=state.positions.filter(p=>data[p.symbol].kind==='Equity').reduce((a,p)=>a+p.quantity*data[p.symbol].price,0);const ep=t.total?equities/t.total*100:0;return '<div class="page-head between"><div><h1>Your portfolio</h1><p>Understand what you own and where the risk sits.</p></div><button class="button primary" data-action="position">'+icon('plus')+'<span>Add</span></button></div><div class="portfolio-top"><section class="panel"><span class="muted">Example portfolio value</span><div class="balance num">'+money(t.total)+'</div><span class="'+(t.gain>=0?'positive':'negative')+'">'+money(t.gain)+' · '+pct(t.change)+' <small>unrealized</small></span><div class="mini-stats"><div><strong class="num">'+money(t.cost,0)+'</strong><span>Cost basis · USD</span></div><div><strong>'+state.positions.length+'</strong><span>Positions</span></div></div></section><section class="panel"><h2>Your allocation</h2><p class="small" style="margin-top:8px">Based on the example holdings below</p><div class="allocation-bar"><span style="width:'+ep+'%;background:var(--blue)"></span><span style="width:'+(100-ep)+'%;background:var(--purple)"></span></div><div class="allocation-legend"><span><i style="background:var(--blue)"></i>Equities '+ep.toFixed(0)+'%</span><span><i style="background:var(--purple)"></i>Crypto '+(100-ep).toFixed(0)+'%</span></div><p class="inline-note">Review concentration alongside each investment thesis.</p></section></div><div class="section-title"><h2>Holdings <span class="positions-count">'+state.positions.length+' positions</span></h2><span class="small">Example prices · USD</span></div><section class="panel holdings-list"><div class="holdings-labels"><span>Asset</span><span>Price</span><span>Average cost</span><span>Value / return</span><span></span></div>'+state.positions.map(p=>{const d=data[p.symbol],v=p.quantity*d.price,g=p.quantity*(d.price-p.cost);return '<div class="asset-row"><button class="asset-open asset-name" data-stock="'+p.symbol+'">'+logo(p.symbol)+'<span><b>'+d.name+'</b><small>'+p.quantity+' '+(d.kind==='Crypto'?'units':'shares')+'</small></span></button><div class="asset-price num">'+money(d.price)+'</div><div class="holding-cost holdings-value num">'+money(p.cost)+'</div><div class="holdings-value num"><strong>'+money(v)+'</strong><small class="'+(g>=0?'positive':'negative')+'">'+(g>=0?'+':'')+money(g)+'</small></div><button class="icon-btn" data-edit="'+p.symbol+'" aria-label="Edit '+d.name+' position">'+icon('edit')+'</button></div>'}).join('')+'</section>'+notice()}
function renderSettings(){return '<div class="page-head"><h1>Make AURYN yours.</h1><p>Readable, comfortable and consistent across screens.</p></div><section class="panel settings-panel"><div class="setting-row"><div><strong>Appearance</strong><p>Color stays purposeful in every theme.</p></div><div class="segmented" role="group" aria-label="Appearance">'+['dark','light','system'].map(v=>'<button data-theme="'+v+'" class="'+(state.theme===v?'active':'')+'" aria-pressed="'+(state.theme===v)+'">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('')+'</div></div><div class="setting-row"><div><strong>Text size</strong><p>Readable by default. Larger when you need it.</p></div><div class="segmented" role="group" aria-label="Text size">'+['standard','large'].map(v=>'<button data-size="'+v+'" class="'+(state.size===v?'active':'')+'" aria-pressed="'+(state.size===v)+'">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('')+'</div></div><div class="setting-row"><div><strong>Reduce motion</strong><p>Also respects your device preference.</p></div><button class="button" data-action="motion" aria-pressed="'+document.body.classList.contains('reduced')+'">'+(document.body.classList.contains('reduced')?'On':'Off')+'</button></div></section><div class="review-tools"><button class="button" data-action="phone">'+icon('phone')+(document.getElementById('stage').classList.contains('phone')?'Use full width':'Preview phone width')+'</button><button class="button" data-help="Sample data">'+icon('info')+'About this preview</button><p>Design review only. Theme preferences stay in this browser. Holdings and watchlist changes reset when the file is reopened.</p></div>'+notice()}
function render(){const focused=document.activeElement;const focusKey=['tab','range','horizon','scenario'].find(k=>focused?.dataset?.[k]);const focusValue=focusKey?focused.dataset[focusKey]:null;updateNav();document.getElementById('main').innerHTML=state.page==='research'?renderResearch():state.page==='overview'?renderOverview():state.page==='watchlist'?renderWatchlist():state.page==='portfolio'?renderPortfolio():renderSettings();bindCharts();if(focusKey)document.querySelector('[data-'+focusKey+'="'+focusValue+'"]')?.focus({preventScroll:true})}
function navigate(page,stock){state.page=page;if(stock){state.symbol=stock;state.tab='Overview';state.range='1Y';state.horizon='Long term'}render();window.scrollTo({top:0,behavior:'instant'});}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('visible'),2600)}
function showInfo(key){const [title,...paragraphs]=info[key]||info['Sample data'];document.getElementById('info-title').textContent=title;document.getElementById('info-copy').innerHTML=paragraphs.map(p=>'<p>'+p+'</p>').join('');document.getElementById('info-dialog').showModal()}
function search(){document.getElementById('search-dialog').showModal();const input=document.getElementById('search-input');input.value='';searchResults('');input.focus()}
function searchResults(q){q=q.trim().toLowerCase();const matches=Object.values(data).filter(d=>(d.name+' '+d.ticker+' '+d.ticker.replace('/','')).toLowerCase().includes(q));document.getElementById('search-results').innerHTML=matches.length?matches.map(d=>'<button class="search-result" data-stock="'+d.ticker+'">'+logo(d.ticker)+'<span class="result-meta"><strong>'+d.name+'</strong><small>'+d.ticker+' · '+d.kind+'</small></span><span class="price num">'+money(d.price)+'</span>'+icon('chevron')+'</button>').join(''):'<div class="empty"><h3>No example asset matches.</h3><p>Try Microsoft, IREN, SAP, NVIDIA, BTC or ETH.</p></div>'}
function editPosition(symbol){state.editing=symbol||null;const p=state.positions.find(p=>p.symbol===symbol);document.getElementById('position-title').textContent=p?'Edit example position':'Add an example position';document.getElementById('position-symbol').innerHTML=Object.values(data).map(d=>'<option value="'+d.ticker+'">'+d.name+' · '+d.ticker+'</option>').join('');document.getElementById('position-symbol').value=symbol||'MSFT';document.getElementById('position-symbol').disabled=!!p;document.getElementById('position-quantity').value=p?p.quantity:'';document.getElementById('position-cost').value=p?p.cost:'';document.getElementById('position-dialog').showModal()}
function bindCharts(){document.querySelectorAll('.chart-wrap').forEach(el=>{el.addEventListener('pointermove',e=>{const svg=el.querySelector('svg'),rect=svg.getBoundingClientRect(),values=series(el.dataset.chart,el.dataset.range),ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/(rect.width*607/680))),i=Math.round(ratio*(values.length-1)),tip=el.querySelector('.chart-tooltip');tip.textContent=money(values[i])+' · Example point '+(i+1)+' of '+values.length;tip.hidden=false});el.addEventListener('pointerleave',()=>el.querySelector('.chart-tooltip').hidden=true)})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset;
 if(a.close){document.getElementById(a.close).close();return}
 if(a.stock){document.querySelectorAll('dialog[open]').forEach(d=>d.close());navigate('research',a.stock);return}
 if(a.page){navigate(a.page);return}
 if(a.tab){state.tab=a.tab;render();return}
 if(a.help){showInfo(a.help);return}
 if(a.range){state.range=a.range;render();return}
 if(a.horizon){state.horizon=a.horizon;render();return}
 if(a.scenario){state.scenario=a.scenario;render();return}
 if(a.remove){state.saved.delete(a.remove);render();toast('Removed from the example watchlist');return}
 if(a.edit){editPosition(a.edit);return}
 if(a.theme){state.theme=a.theme;applyTheme();render();return}
 if(a.size){state.size=a.size;applyTheme();render();return}
 if(a.action==='search')search();
 if(a.action==='theme'){state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();if(state.page==='settings')render()}
 if(a.action==='save'){if(state.saved.has(state.symbol)){state.saved.delete(state.symbol);toast('Removed from the example watchlist')}else{state.saved.add(state.symbol);toast('Saved to the example watchlist')}render()}
 if(a.action==='position')editPosition();
 if(a.action==='phone'){document.getElementById('stage').classList.toggle('phone');document.querySelector('.preview-phone').setAttribute('aria-pressed',document.getElementById('stage').classList.contains('phone'));if(state.page==='settings')render();toast(document.getElementById('stage').classList.contains('phone')?'Phone width · Return to full width in Preferences':'Full-width preview')}
 if(a.action==='motion'){document.body.classList.toggle('reduced');render()}
});
document.addEventListener('change',e=>{if(e.target.dataset.overlay){state[e.target.dataset.overlay]=e.target.checked;render()}});
document.getElementById('search-input').addEventListener('input',e=>searchResults(e.target.value));
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.querySelector('dialog[open]'))search()}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.getElementById('position-form').addEventListener('submit',e=>{e.preventDefault();const symbol=document.getElementById('position-symbol').value,quantity=Number(document.getElementById('position-quantity').value),cost=Number(document.getElementById('position-cost').value);if(!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(cost)||cost<0)return;const p=state.positions.find(p=>p.symbol===symbol);if(p){p.quantity=quantity;p.cost=cost}else state.positions.push({symbol,quantity,cost});document.getElementById('position-dialog').close();render();toast('Example position saved · No real account changed')});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()});
document.querySelectorAll('.auryn-logo').forEach((el,i)=>el.innerHTML=brand.replaceAll('__ID__',String(i)));
applyTheme();render();
</script>
</body>
</html>
