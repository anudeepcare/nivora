name: AURYN Portfolio Learning Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'

concurrency:
  group: auryn-portfolio-learning
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Freeze current portfolio decisions for validation
        env:
          AURYN_PRODUCTION_URL: ${{ secrets.AURYN_PRODUCTION_URL }}
          TRADING_LAB_CRON_SECRET: ${{ secrets.TRADING_LAB_CRON_SECRET }}
        run: |
          test -n "$AURYN_PRODUCTION_URL"
          test -n "$TRADING_LAB_CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --max-time 180 \
            -H "Authorization: Bearer $TRADING_LAB_CRON_SECRET" \
            "${AURYN_PRODUCTION_URL%/}/api/portfolio/learn"
