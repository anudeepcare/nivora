name: AURYN Portfolio Learning Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'

concurrency:
  group: auryn-portfolio-learning
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Freeze current portfolio decisions for validation
        env:
          AURYN_BASE_URL: ${{ secrets.AURYN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

        run: |
          test -n "$AURYN_BASE_URL"
          test -n "$CRON_SECRET"

          curl --fail --silent --show-error --retry 2 --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${AURYN_BASE_URL%/}/api/portfolio/learn"