name: AURYN V9.9.7 Autonomous Market Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: auryn-v997-market-cycle
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run session orchestration and drain durable validation queue
        env:
          AURYN_BASE_URL: ${{ secrets.AURYN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AURYN_QUEUE_BURST: "10"
          AURYN_QUEUE_MAX_RUNTIME_MS: "480000"
          AURYN_QUEUE_MAX_JOBS: "40"
          AURYN_QUEUE_SPACING_MS: "6000"
        run: node scripts/auryn-v997-market-cycle.mjs
