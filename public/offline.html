<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1f3ee" />
    <title>AURYN · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(ellipse at 20% 10%, #76b6aa26, transparent 65%),
          light-dark(#f1f3ee, #1b2922);
        color: light-dark(#24332e, #eff5ec);
        font-size: 16px;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px;
        border-radius: 24px;
        background: light-dark(#ffffffa8, #223128ed);
        box-shadow: 0 16px 54px #142a3512;
        backdrop-filter: blur(24px);
      }
      img {
        width: 44px;
        height: 44px;
      }
      h1 {
        font-weight: 600;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        color: light-dark(#53635b, #bdccbf);
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 14px;
        background: light-dark(#284c3e, #d6f35a);
        color: light-dark(#f6faee, #253522);
        padding: 12px 22px;
        min-height: 48px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid light-dark(#24332e, #eff5ec);
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 20px;
        color: light-dark(#53635b, #bdccbf);
      }
      @media (prefers-reduced-transparency: reduce) {
        main {
          background: light-dark(#fff, #223128);
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="AURYN" />
      <h1>You’re offline.</h1>
      <p>Reconnect to load your account and current research.</p>
      <button onclick="location.reload()">Try again</button
      ><small
        >Private holdings and market quotes are never stored on this offline
        page.</small
      >
    </main>
  </body>
</html>
